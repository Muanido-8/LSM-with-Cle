<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Avatar 3D Animado</title>
    <link rel="stylesheet" href="bs.min.css">
    <script type="module" src="model-viewer.min.js"></script>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background-color: transparent;
        }
        :root {
            background-color: transparent;
        }
        #model-container {
            width: 100%;
            height: 600px; /* viewport portrait */
        }
        #controls {
            margin: 10px;
        }
    </style>
</head>
<body>

    
    <div id="controls" class="d-flex flex-column align-items-center">
        <model-viewer
            id="avatar"
            src="cle.glb"
            shadow-intensity="1"
            camera-controls
            interaction-prompt="none"
            style="width: 100%; height: 600px; background-color: transparent"
            touch-action="pan-y"
            scal
        >
            <h2 class="form-label text-center">Que gesto gostaria de aprender?</h2>
             <div class="position-absolute bottom-0 start-50 translate-middle-x mb-3">
                <div class="d-flex flex-row align-items-center justify-content-between gap-2">
                    <select id="animations" class="form-select mb-0" style="width: 230px;">
                        <option value="mixamo.com">Mixamo</option>
                        <option value="VID_20250916_104809">VID_20250916_104809</option>
                        <option value="VID_20250916_122200">VID_20250916_122200</option>
                    </select>
                    <button id="playBtn" class="btn btn-primary">Repetir</button>
                </div>
                <button id="closeBtn" class="btn btn-outline-danger col-12 mt-3 px-2 py-1">Voltar</button>
            </div>
        </model-viewer>
    </div>

    <script>
        const modelViewer = document.querySelector('#avatar');
        const select = document.querySelector('#animations');
        const playBtn = document.querySelector('#playBtn');
        const closeBtn = document.querySelector('#closeBtn');

        // Registra o listener de "finished" apenas uma vez
        modelViewer.addEventListener('finished', () => {
            console.log("Terminou animação:", modelViewer.animationName);
            modelViewer.animationName = "mixamo.com";
            modelViewer.pause();
            modelViewer.currentTime = 0;
        });

        // Função para tocar animação uma vez
        function playAnimation(name) {
            console.log("Play =>", name);
            modelViewer.animationName = name;
            modelViewer.currentTime = 0; // reinicia
            requestAnimationFrame(() => {
                modelViewer.play({ repetitions: 1, pingpong: false });
            });
        }

        // Quando mudar o select, roda a animação imediatamente
        select.addEventListener('change', () => {
            playAnimation(select.value);
        });

        // Quando clicar no botão Repetir, roda a animação atual
        playBtn.addEventListener('click', () => {
            playAnimation(select.value);
        });

        new QWebChannel(qt.webChannelTransport, function(channel) {
            window.bridge = channel.objects.bridge;

            closeBtn.addEventListener('click', () => {
                bridge.backToHome()
            });
        });
    </script>

</body>
</html>
